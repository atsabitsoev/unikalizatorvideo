# Настройки «Уникализатора». Файл читается при каждом запуске,
# после правки ничего перезапускать не нужно.
# Установленная копия лежит здесь:
#   ~/Library/Application Support/Unikalizator/settings.conf

# Сколько копий делать из одного видео.
COUNT=20

# Сила изменений:
#   light  — минимальные изменения (зум 3.5–5%, скорость ±0.8–1.8%),
#            но копии меньше отличаются друг от друга;
#   normal — оптимум: зум 5–8%, скорость ±1.5–3%, на глаз не видно;
#   strong — сильнее (зум 7.5–10%, скорость ±3–5.5%), внимательный глаз может заметить.
STRENGTH=normal

# 1 — зеркалить каждую вторую копию. Очень сильно меняет видео для алгоритмов,
# но заметно, если в кадре есть текст, логотипы или узнаваемое лицо.
MIRROR=0

# 1 — складывать копии в отдельную папку «<имя видео>_uniq» рядом с исходником.
# 0 — класть прямо рядом с исходником.
SUBFOLDER=0

# Кодировщик: auto — аппаратный VideoToolbox (быстро), если он есть;
#             x264 — программный (медленнее, но чуть качественнее).
ENCODER=auto

# Сколько копий кодировать одновременно (auto — по числу ядер процессора).
JOBS=auto

# Короткая сторона кадра в пикселях. Instagram больше 1080 не показывает,
# а 4K-исходники так обрабатываются в разы быстрее.
MAX_SIDE=1080
